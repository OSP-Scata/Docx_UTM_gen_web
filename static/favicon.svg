<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 511 512" width="100%" height="100%">
  <defs>
    <!-- ИСПРАВЛЕНО: Правильный и рабочий импорт шрифта Montserrat (Bold) -->
    <style>
      @import url('https://googleapis.com');
      
      .font-utm { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #103F8A; font-size: 120px; transition: fill 0.3s; }
      .font-docx { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 146.667px; }
      .bg-sheet { fill: rgb(210, 227, 252); transition: fill 0.3s; }
      .bg-corner { fill: rgb(168, 199, 250); transition: fill 0.3s; }
      
      /* АДАПТАЦИЯ ПОД ТЁМНУЮ ТЕМУ ВКЛАДКИ */
      @media (prefers-color-scheme: dark) {
        svg {
            /* Мягкое свечение вокруг всей иконки, чтобы отделить её от черноты вкладки */
            filter: drop-shadow(0px 0px 2px rgba(255, 255, 255, 0.6));
        }
        .font-utm {
            /* ИСПРАВЛЕНО: Делаем буквы UTM ярко-голубыми в тёмной теме, чтобы они не слепили, но читались */
            fill: #4285F4; 
        }
        .bg-sheet {
            /* Слегка притеняем белый лист в тёмной теме, чтобы был контраст с буквами */
            fill: rgb(232, 240, 254);
        }
      }
    </style>
  </defs>

  <!-- Лист бумаги (Добавлен класс bg-sheet) -->
  <path class="bg-sheet" fill-rule="evenodd" d="M81.0,0.0 L328.999,0.0 L454.999,127.0 L454.999,479.0 C454.999,497.225 440.225,511.999 421.999,511.999 L81.0,511.999 C62.774,511.999 48.0,497.225 48.0,479.0 L48.0,32.999 C48.0,14.774 62.774,0.0 81.0,0.0 Z"/>
  
  <!-- Загнутый уголок (Добавлен класс bg-corner) -->
  <path class="bg-corner" fill-rule="evenodd" d="M328.999,126.999 L328.999,0.0 L455.0,126.999 L328.999,126.999 Z"/>
  
  <!-- Синяя плашка -->
  <path fill-rule="evenodd" fill="rgb(24, 90, 189)" d="M15.0,256.0 L495.999,256.0 C504.284,256.0 511.0,262.715 511.0,271.0 L511.0,445.999 C511.0,454.284 504.284,460.999 495.999,460.999 L15.0,460.999 C6.715,460.999 0.0,454.284 0.0,445.999 L0.0,271.0 C0.0,262.715 6.715,256.0 15.0,256.0 Z"/>
  
  <!-- Текст UTM -->
  <text x="119" y="221.04" class="font-utm">UTM</text>
  
  <!-- Текст DOCX -->
  <text x="41" y="395.16" class="font-docx">DOCX</text>
</svg>