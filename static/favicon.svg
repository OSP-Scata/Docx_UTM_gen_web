<svg xmlns="http://w3.org" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <style>
      .icon-bg { fill: #185ABD; transition: fill 0.3s; }
      .icon-chain { fill: #FFFFFF; }
      
      @media (prefers-color-scheme: dark) {
        svg { filter: drop-shadow(0px 0px 1px rgba(255, 255, 255, 0.8)); }
        .icon-bg { fill: #2b78f5; }
      }
    </style>
  </defs>

  <!-- Синяя плашка в форме закругленного документа Word -->
  <rect class="icon-bg" x="2" y="2" width="28" height="28" rx="6" />
  
  <!-- Загнутый декоративный уголок листа (крупный, не потеряется) -->
  <path d="M22 2 L30 10 L22 10 Z" fill="rgba(255,255,255,0.4)" />

  <!-- Жирный, четкий векторный символ UTM-ссылки (звено цепи) по центру -->
  <g class="icon-chain" transform="translate(4, 5) scale(0.85)">
    <path d="M10.5 13.5c-.3 0-.5-.1-.7-.3l-3-3c-.4-.4-.4-1 0-1.4l3-3c.4-.4 1-.4 1.4 0s.4 1 0 1.4L9.4 11h3.1c.6 0 1-.4 1-1V5.5c0-.6-.4-1-1-1H7c-1.9 0-3.5 1.6-3.5 3.5v5c0 1.9 1.6 3.5 3.5 3.5h3.5c.6 0 1-.4 1-1s-.4-1-1-1h-3.5c-.8 0-1.5-.7-1.5-1.5v-5c0-.8.7-1.5 1.5-1.5h4.1v2.1c0 1.7 1.3 3 3 3h5.6c1.7 0 3-1.3 3-3v-5c0-1.7-1.3-3-3-3h-3.5c-.6 0-1 .4-1 1s.4 1 1 1h3.5c.6 0 1 .4 1 1v5c0 .6-.4 1-1 1h-5.6l1.8-1.8c.4-.4 4-1 0-1.4s-1-.4-1.4 0l-3 3c-.2.2-.3.4-.3.7z"/>
  </g>
</svg>